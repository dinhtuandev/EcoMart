name: CD

# Triển khai:
# - Backend → Render Blueprint (render.yaml ở root, autoDeploy: true).
#   Push lên main là Render tự build + deploy, workflow này chỉ validate
#   descriptor và bắn deploy hook NẾU repo dùng service non-Blueprint.
# - Frontend → Vercel Git integration (Root Directory = ecomart-frontend).
#   Push lên main là Vercel tự build (npm run build) + deploy,
#   vercel.json giữ SPA rewrites về index.html.

on:
  push:
    branches: [main]
    paths:
      - 'render.yaml'
      - 'ecomart-backend/Dockerfile'
      - 'ecomart-backend/src/**'
      - 'ecomart-backend/pom.xml'
      - 'ecomart-frontend/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-descriptors:
    name: Validate deploy descriptors
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate render.yaml
        run: |
          python3 - <<'EOF'
          import sys, yaml
          with open('render.yaml', encoding='utf-8') as f:
              doc = yaml.safe_load(f)
          svc = doc['services'][0]
          assert svc['runtime'] == 'docker', 'backend phải dùng docker runtime'
          assert svc['dockerContext'] == './ecomart-backend', 'dockerContext sai'
          assert svc['healthCheckPath'] == '/actuator/health', 'healthcheck phải là /actuator/health'
          keys = {v['key'] for v in svc['envVars']}
          for required in ('SPRING_DATASOURCE_URL', 'APP_JWT_SECRET',
                            'MAIL_USERNAME', 'MAIL_PASSWORD',
                            'APP_CORS_ALLOWED_ORIGIN_PATTERNS'):
              assert required in keys, f'thiếu env {required} trong render.yaml'
          print('render.yaml OK:', svc['name'], svc['region'], svc['plan'])
          EOF

      - name: Validate vercel.json
        run: |
          python3 - <<'EOF'
          import json
          with open('ecomart-frontend/vercel.json', encoding='utf-8') as f:
              doc = json.load(f)
          assert doc['outputDirectory'] == 'dist', 'Vite build ra dist/'
          assert any(r.get('destination') == '/index.html' for r in doc.get('rewrites', [])), \
              'thiếu SPA rewrite về /index.html'
          print('vercel.json OK')
          EOF

  trigger-render-hook:
    name: Trigger Render deploy hook (optional)
    needs: validate-descriptors
    # Chỉ chạy khi repo KHÔNG dùng Blueprint autoDeploy mà dùng service
    # thường + deploy hook. Tạo hook ở Render Dashboard → service →
    # Settings → Deploy Hook, lưu vào secret RENDER_DEPLOY_HOOK_URL.
    # Không có secret thì step bỏ qua, Blueprint autoDeploy vẫn deploy.
    runs-on: ubuntu-latest
    steps:
      - name: Fire deploy hook if configured
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo 'No RENDER_DEPLOY_HOOK_URL — relying on Blueprint autoDeploy.'
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL" && echo 'Render deploy triggered.'
