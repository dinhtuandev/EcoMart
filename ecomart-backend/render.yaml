# ============================================================
# render.yaml — Render Blueprint (Infrastructure as Code)
# Khai báo Web Service + tích hợp external DB (Supabase).
# Render đọc file này khi tạo Blueprint mới.
#
# Lưu ý: SPRING_DATASASE_URL/USER/PASSWORD phải set thủ công
# trong Render Dashboard sau khi tạo Supabase project.
# ============================================================

services:
  - type: web
    name: ecomart-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8081"
      # --- Database (set trong Dashboard sau khi tạo Supabase) ---
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # --- JPA: lần đầu dùng "update" để tạo schema, sau đó đổi "validate" ---
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      # --- Secrets (set trong Dashboard, KHÔNG commit) ---
      - key: APP_JWT_SECRET
        sync: false
      - key: APP_JWT_EXPIRATION_MS
        value: "86400000"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_PAY_URL
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: VNPAY_RETURN_URL
        sync: false
      - key: SEPAY_API_KEY
        sync: false
      - key: SEPAY_ACCOUNT_NUMBER
        sync: false
      - key: SEPAY_BANK
        value: "970415"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
